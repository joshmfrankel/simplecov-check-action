# Dogfood the checked-out action against each generated SimpleCov report format.
name: Testing

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - main
jobs:
  rspec:
    name: RSpec (SimpleCov ${{ matrix.simplecov }})
    permissions: write-all
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - simplecov: '0.22'
            gemfile: gemfiles/simplecov_0_22.gemfile
          - simplecov: '1.0.1'
            gemfile: gemfiles/simplecov_1_x.gemfile
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}

    steps:
      - uses: actions/checkout@v2

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.2'
          bundler: '4.0.3'
          bundler-cache: true

      - name: Run tests
        run: |
          bundle exec rspec specs/

      # Using the current repo to perform coverage analysis
      - uses: ./
        with:
          check_job_name: SimpleCov ${{ matrix.simplecov }}
          minimum_suite_coverage: 85
          minimum_file_coverage: 70
          github_token: ${{ secrets.GITHUB_TOKEN }}
